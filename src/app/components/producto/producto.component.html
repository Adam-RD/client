<div class="container mt-4">
  <h2>Lista de Productos</h2>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Título</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let producto of productos">
        <td>{{ producto.id }}</td>
        <td>{{ producto.nombre }}</td>
        <td>{{ producto.precio| currency:'USD':'symbol':'1.2-2' }}</td>
        <td>
          <button class="btn btn-danger btn-sm me-2" (click)="deleteProducto(producto.id)">Eliminar</button>
          <button class="btn btn-warning btn-sm me-2" (click)="openEditModal(productos)">Editar</button>
        </td>

      </tr>
    </tbody>

  </table>


<div class="mt-3">
  <h3>Agregar Producto</h3>
  <form (ngSubmit)="addProducto(nuevoProducto)">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" class="form-control" [(ngModel)]="nuevoProducto.nombre" name="nombre" required>
    </div>
    <div class="form-group">
      <label for="precio">Precio:</label>
      <input type="number" id="precio" class="form-control" [(ngModel)]="nuevoProducto.precio" name="precio" required>
    </div>
    <button type="submit" class="btn btn-primary mt-2">Agregar Producto</button>
  </form>
</div>



</div>
